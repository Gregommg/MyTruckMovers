# Quick local run:  docker compose up --build
# Copy server/.env.example to server/.env and set local credentials before starting.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: mytruckmovers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytruckmovers"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  trackmovers:
    build: .
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: change-this-to-a-long-random-string
      NEARBY_KM: "10"
      RETRY_MINUTES: "10"
      MAX_RETRIES: "5"
      ADMIN_KEY: change-this-admin-key
      DATABASE_URL: postgres://postgres:postgres@db:5432/mytruckmovers
      PGSSL: "false"
      ROUTING_URL: https://router.project-osrm.org
      # --- Email for password-reset codes (leave blank to only log codes to console) ---
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "MyTruckMovers <gregorymark068@gmail.com>"
    volumes:
      - trackmovers_uploads:/app/server/data/uploads
    restart: unless-stopped
volumes:
  postgres_data:
  trackmovers_uploads:
