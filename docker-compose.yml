# Quick local run:  docker compose up --build
# Edit the environment block below (or use an env_file: .env) with your own
# JWT_SECRET, M-Pesa and SMTP values before deploying for real.
services:
  trackmovers:
    build: .
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: change-this-to-a-long-random-string
      NEARBY_KM: "10"
      RETRY_MINUTES: "10"
      MAX_RETRIES: "5"
      ADMIN_KEY: change-this-admin-key
      ROUTING_URL: https://router.project-osrm.org
      # --- M-Pesa Daraja (leave blank to disable payments) ---
      MPESA_ENV: sandbox
      MPESA_SHORTCODE: ""
      MPESA_PASSKEY: ""
      MPESA_CONSUMER_KEY: "peO9A2wJeIyMooM0L42Luj4130GMGjCchl9mNA7IUxDsF6Yl"
      MPESA_CONSUMER_SECRET: "pP2clZN6Br9Kym8I0OjpHtXjd1FFq7CfkAclMEPiIXPeShbGpZ3YuZW81o4Vxu6R"
      MPESA_CALLBACK_URL: ""
      MPESA_CALLBACK_SECRET: change-this-too
      # --- Email for password-reset codes (leave blank to only log codes to console) ---
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "MyTruckMovers <gregorymark068@gmail.com>"
    volumes:
      - trackmovers_data:/app/server/data
    restart: unless-stopped
volumes:
  trackmovers_data:
